<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Bypasser</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-dark: #0ea5e9;
    --border: #334155;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    max-width: 560px;
    width: 100%;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0b1220;
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #06202f;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #0b1220;
    border: 1px solid var(--border);
    word-break: break-all;
    display: none;
  }
  .result.show { display: block; }
  .result a { color: var(--good); text-decoration: none; }
  .result a:hover { text-decoration: underline; }
  .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .chain { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
  .chain div { padding: 4px 0; border-top: 1px solid var(--border); }
  .status { margin-top: 14px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  .error { color: var(--bad); }
  .copybtn {
    margin-top: 10px;
    display: inline-block;
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.8rem;
    width: auto;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Link Bypasser</h1>
  <p class="sub">Paste a shortened / ad-gated link and get the real destination, no ads, no waiting.</p>

  <input type="text" id="urlInput" placeholder="https://shrinkme.click/xyz..." autocomplete="off">
  <button id="goBtn">Bypass</button>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="label">Final URL</div>
    <a id="finalLink" href="#" target="_blank" rel="noopener"></a>
    <br>
    <button class="copybtn" id="copyBtn">Copy link</button>
    <div class="chain" id="chain"></div>
  </div>
</div>

<script>
const PARAM_KEYS = ["url", "link", "to", "dest", "target", "redirect", "u"];

// Tried in order. Each entry knows how to build the request and how to
// pull {finalUrl, html} out of that proxy's particular response shape.
const PROXIES = [
  {
    name: "allorigins",
    build: (u) => "https://api.allorigins.win/get?url=" + encodeURIComponent(u),
    parse: async (resp, inputUrl) => {
      const data = await resp.json();
      return { finalUrl: (data.status && data.status.url) || inputUrl, html: data.contents || "" };
    }
  },
  {
    name: "codetabs",
    build: (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
    parse: async (resp, inputUrl) => {
      // This proxy returns the raw final page with no separate "final URL"
      // field, so we can only recover the destination via the HTML/param
      // scan below, not via an HTTP-redirect URL.
      const html = await resp.text();
      return { finalUrl: inputUrl, html };
    }
  }
];

const urlInput = document.getElementById("urlInput");
const goBtn = document.getElementById("goBtn");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const finalLinkEl = document.getElementById("finalLink");
const chainEl = document.getElementById("chain");
const copyBtn = document.getElementById("copyBtn");

function extractParam(urlStr) {
  try {
    const u = new URL(urlStr);
    for (const key of PARAM_KEYS) {
      const val = u.searchParams.get(key);
      if (val && /^https?:\/\//i.test(val)) return val;
    }
  } catch (e) {}
  return null;
}

function extractFromHtml(html) {
  // meta refresh: <meta http-equiv="refresh" content="0;url=https://...">
  let m = html.match(/http-equiv=["']refresh["'][^>]*content=["'][^"']*url=([^"'>]+)["']/i);
  if (m) return m[1];

  // JS location.replace("...") / location.href = "..."
  m = html.match(/location\.(?:replace|href|assign)\s*[\(=]\s*["']([^"']+)["']/i);
  if (m) return m[1];

  return null;
}

async function bypass(inputUrl) {
  const chain = [inputUrl];
  let lastErr = null;

  for (const proxy of PROXIES) {
    try {
      const resp = await fetch(proxy.build(inputUrl));
      if (!resp.ok) throw new Error(proxy.name + " returned " + resp.status);

      const { finalUrl: afterRedirects, html } = await proxy.parse(resp, inputUrl);
      if (afterRedirects !== inputUrl) chain.push(afterRedirects);

      // 1. Check both URLs for an embedded destination param
      for (const link of [afterRedirects, inputUrl]) {
        const found = extractParam(link);
        if (found) {
          chain.push(found);
          return { finalUrl: found, chain };
        }
      }

      // 2. Scan the page HTML for a meta-refresh or JS redirect
      if (html) {
        const found = extractFromHtml(html);
        if (found) {
          const resolved = new URL(found, afterRedirects).href;
          chain.push(resolved);
          return { finalUrl: resolved, chain };
        }
      }

      // 3. Fall back to wherever the HTTP redirects landed
      return { finalUrl: afterRedirects, chain, uncertain: true };
    } catch (err) {
      lastErr = err;
      chain.push(`(${proxy.name} failed: ${err.message} — trying next)`);
    }
  }

  throw lastErr || new Error("All proxies failed");
}

async function run() {
  const val = urlInput.value.trim();
  if (!val) return;

  goBtn.disabled = true;
  statusEl.textContent = "Resolving...";
  statusEl.classList.remove("error");
  resultEl.classList.remove("show");

  try {
    const { finalUrl, chain, uncertain } = await bypass(val);
    finalLinkEl.href = finalUrl;
    finalLinkEl.textContent = finalUrl;
    chainEl.innerHTML = chain.map(c => `<div>${c}</div>`).join("");
    resultEl.classList.add("show");
    statusEl.textContent = uncertain
      ? "Followed redirects, but couldn't confirm this skips the ad gate — check the link below."
      : "Done.";
  } catch (err) {
    statusEl.textContent = "Couldn't resolve that link: " + err.message;
    statusEl.classList.add("error");
  } finally {
    goBtn.disabled = false;
  }
}

goBtn.addEventListener("click", run);
urlInput.addEventListener("keydown", e => { if (e.key === "Enter") run(); });

copyBtn.addEventListener("click", () => {
  navigator.clipboard.writeText(finalLinkEl.href).then(() => {
    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = "Copy link"), 1200);
  });
});
</script>
</body>
</html>
